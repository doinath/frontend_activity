<section id="contact" class="contact" aria-labelledby="contact-heading">
  <div class="contact__details">
    <nctv-eyebrow-badge label="Contact us" />
    <h2 id="contact-heading" class="contact__heading">Let's talk about your market.</h2>
    <p class="contact__paragraph">
      Fill out the form and our team will reach out to schedule a call and walk you through the
      opportunity in your area.
    </p>
  </div>

  <form class="contact__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    @if (submitted()) {
      <p class="contact__success" role="status">Thanks — we'll be in touch shortly.</p>
    }

    <label class="contact__field">
      <span class="contact__label">Full name</span>
      <input
        class="contact__input"
        [class.contact__input--error]="isInvalid('fullName')"
        type="text"
        formControlName="fullName"
        placeholder="Jordan Rivera"
      />
      @if (isInvalid('fullName')) {
        <span class="contact__error">{{ getErrorMessage('fullName') }}</span>
      }
    </label>

    <div class="contact__field-row">
      <label class="contact__field">
        <span class="contact__label">Email</span>
        <input
          class="contact__input"
          [class.contact__input--error]="isInvalid('email')"
          type="email"
          formControlName="email"
          placeholder="jordan@email.com"
        />
        @if (isInvalid('email')) {
          <span class="contact__error">{{ getErrorMessage('email') }}</span>
        }
      </label>

      <label class="contact__field">
        <span class="contact__label">Phone</span>
        <input class="contact__input" type="tel" formControlName="phone" placeholder="(555) 000-0000" />
      </label>
    </div>

    <label class="contact__field">
      <span class="contact__label">Market</span>
      <input
        class="contact__input"
        [class.contact__input--error]="isInvalid('market')"
        type="text"
        formControlName="market"
        placeholder="e.g. Boise, ID"
      />
      @if (isInvalid('market')) {
        <span class="contact__error">{{ getErrorMessage('market') }}</span>
      }
    </label>

    <label class="contact__field">
      <span class="contact__label">Message</span>
      <textarea
        class="contact__input contact__input--area"
        formControlName="message"
        placeholder="What are you looking for?"
      ></textarea>
    </label>

    <ntv-button
      type="submit"
      variant="primary"
      color="custom"
      customColor="#92c74d"
      rounded="full"
      customHeight="52px"
      [fullWidth]="true"
      [loading]="isSubmitting()"
    >
      Request a call
    </ntv-button>
  </form>
</section>
