<header class="site-header" [class.site-header--compact]="isCompact()">
  <div class="site-header__inner">
    <nctv-logo />

    <div class="site-header__actions">
      <ntv-button
        class="site-header__cta"
        [class.site-header__cta--visible]="isCtaVisible()"
        variant="primary"
        color="custom"
        customColor="#92c74d"
        rounded="full"
        size="sm"
        (buttonClick)="onBookCallClick()"
      >
        Book a call
      </ntv-button>

      <button
        type="button"
        class="site-header__menu-toggle"
        [class.site-header__menu-toggle--open]="isMenuOpen()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="site-header-menu"
        aria-label="Toggle section menu"
        (click)="toggleMenu()"
      >
        <span class="site-header__menu-bar"></span>
        <span class="site-header__menu-bar"></span>
        <span class="site-header__menu-bar"></span>
      </button>
    </div>
  </div>

  @if (isMenuOpen()) {
    <div class="site-header__backdrop" (click)="closeMenu()"></div>
    <nav id="site-header-menu" class="site-header__menu" aria-label="Section navigation">
      <ntv-button
        variant="primary"
        color="custom"
        customColor="#92c74d"
        rounded="full"
        [fullWidth]="true"
        (buttonClick)="onBookCallClick()"
      >
        Book a call
      </ntv-button>

      @for (link of links(); track link.path) {
        <a class="site-header__menu-link" [href]="link.path" (click)="closeMenu()">
          {{ link.label }}
        </a>
      }
    </nav>
  }
</header>
