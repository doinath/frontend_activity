<nav class="section-nav" aria-label="Section navigation">
  <div class="section-nav__rail-wrap">
    @if (activeLink(); as active) {
      <a
        class="section-nav__pill"
        [class.section-nav__pill--visible]="isVisible()"
        [style.top.px]="pillOffsetPx()"
        [href]="active.path"
        (click)="onNavClick($event, active.path)"
      >
        {{ active.label }}
      </a>
    }
    <ul class="section-nav__rail">
      @for (link of links(); track link.path) {
        <li>
          <a
            [href]="link.path"
            class="section-nav__dot"
            [class.section-nav__dot--active]="activeLink()?.path === link.path"
            [attr.aria-current]="activeLink()?.path === link.path ? 'true' : null"
            [attr.aria-label]="link.label"
            (click)="onNavClick($event, link.path)"
          >
            @switch (link.icon) {
              @case ('home') {
                <svg class="section-nav__dot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                  <path d="M9 22V12h6v10" />
                </svg>
              }
              @case ('model') {
                <svg class="section-nav__dot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="3" width="7" height="7" />
                  <rect x="14" y="3" width="7" height="7" />
                  <rect x="14" y="14" width="7" height="7" />
                  <rect x="3" y="14" width="7" height="7" />
                </svg>
              }
              @case ('services') {
                <svg class="section-nav__dot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
                </svg>
              }
              @case ('podcast') {
                <svg class="section-nav__dot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                  <line x1="12" y1="19" x2="12" y2="23" />
                  <line x1="8" y1="23" x2="16" y2="23" />
                </svg>
              }
              @case ('contact') {
                <svg class="section-nav__dot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
              }
            }
          </a>
        </li>
      }
    </ul>
  </div>
</nav>
